# ==========================================
# SiteWatch Configuration File
# ==========================================

# ช่วงเวลา Timeout ในการตรวจสอบ (วินาที)
PROBE_TIMEOUT=5

# รายการเป้าหมาย HTTP/HTTPS (URL เต็ม)
# ตรวจสอบ HTTP Status Code และ Response Time ด้วย curl
HTTP_TARGETS=(
    "https://www.google.com"
    "https://github.com"
    "https://httpstat.us/503"
)

# รายการโดเมนที่ต้องการตรวจ DNS Resolution
# ตรวจสอบการแปลงชื่อโฮสต์เป็น IP Address ด้วย getent หรือ dig
DNS_TARGETS=(
    "google.com"
    "cloudflare.com"
    "nonexistent-domain-test-12345.org"
)

# รายการ Service TCP (host:port)
# ตรวจสอบการเปิดของพอร์ตด้วย nc (netcat)
PORT_TARGETS=(
    "1.1.1.1:53"
    "8.8.8.8:53"
    "google.com:443"
    "127.0.0.1:9999"
)

# เส้นทางไฟล์เก็บ Log และ Data
CSV_LOG_FILE="/var/log/sitewatch/metrics.csv"
STATE_FILE="/var/lib/sitewatch/state.env"